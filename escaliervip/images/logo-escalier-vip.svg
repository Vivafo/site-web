<svg viewBox="0 0 280 210" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="280" height="210" fill="#ffffff"/>

  <!-- cadre autour du logo -->
  <rect x="10" y="35" width="250" height="160" fill="none" stroke="#111111" stroke-width="2"/>

  <g transform="translate(40,50)">
    <text x="0" y="45" font-size="40" font-weight="700" fill="#111111" textLength="190" lengthAdjust="spacingAndGlyphs">Escalier</text>

    <!-- rectangle bleu, même longueur que "Escalier", VIP centré verticalement, justifié à gauche -->
    <rect x="0" y="60" width="190" height="55" fill="#0057B8"/>
    <text x="12" y="102" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="4">VIP</text>
  </g>
</svg>
