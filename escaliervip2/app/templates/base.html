<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Escalier VIP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/tailwind.css') }}" />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="py-6 shadow-lg bg-slate-950">
      <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-2xl font-semibold tracking-wide uppercase">Escalier VIP</h1>
      </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-10">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
